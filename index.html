<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Search — Raphael Merchant</title>
<style>
:root {
  --ground: #171514; --card: #201C1A; --card2: #251F1C;
  --rule: #633D29; --text: #E8DFD0; --muted: #B89B78;
  --bone: #D8C5A4; --action: #A52F25; --action-hi: #C24138;
  --cobalt: #35618A; --danger: #E0A39B; --good: #7E8B5A;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding: 22px 18px 60px; max-width: 1180px; margin: 0 auto;
}
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  border-bottom: 2.5px solid var(--action); padding-bottom: 14px; margin-bottom: 8px; flex-wrap: wrap; }
.hdr-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.hdr-sub { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 5px; }
.ctrls { display: flex; gap: 8px; }
.btn { background: var(--card2); color: var(--bone); border: 1px solid var(--rule);
  border-radius: 6px; padding: 7px 13px; font-size: 12px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--bone); }
.btn-primary { background: var(--action); color: #fff; border-color: var(--action); }
.btn-primary:hover { background: var(--action-hi); }
.sec { text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; color: var(--muted);
  margin: 26px 0 10px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.count { color: var(--bone); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 9px; padding: 13px 14px; }
.card.applied { opacity: 0.72; border-color: #3a342f; }
.card.interviewing { border-color: var(--cobalt); }
.card.rejected { opacity: 0.42; }
.card .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.co { font-weight: 700; font-size: 14px; }
.jt { color: var(--muted); font-size: 12px; }
.meta { color: var(--muted); font-size: 11px; margin-top: 5px; }
.fit { color: var(--bone); font-weight: 700; }
.badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 7px;
  border-radius: 20px; border: 1px solid var(--rule); color: var(--muted); }
.badge.ready { color: var(--bone); border-color: var(--bone); }
.badge.applied { color: var(--good); border-color: var(--good); }
.badge.interviewing { color: #9fc1e8; border-color: var(--cobalt); }
.badge.rejected { color: var(--danger); border-color: var(--danger); }
.actions { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
.a { background: var(--card2); color: var(--text); border: 1px solid var(--rule); border-radius: 6px;
  padding: 5px 10px; font-size: 11.5px; cursor: pointer; }
.a:hover { border-color: var(--bone); }
.a.app { background: var(--action); color: #fff; border-color: var(--action); }
.a.app:hover { background: var(--action-hi); }
.a.link { color: var(--cobalt); border-color: var(--cobalt); }
.a.link:hover { color: #9fc1e8; }
.foot { margin-top: 34px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--rule); padding-top: 12px; }
.err { background: #2a1414; border: 1px solid var(--danger); color: var(--danger); padding: 12px;
  border-radius: 8px; margin: 16px 0; }
.skel { color: var(--muted); padding: 30px 0; }
.email-tag { color: var(--cobalt); font-size: 11px; }
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-title">Job Search Dashboard</div>
    <div class="hdr-sub" id="sub">loading…</div>
  </div>
  <div class="ctrls">
    <button class="btn" onclick="load()">&#8635; Refresh</button>
    <button class="btn btn-primary" onclick="runPipeline()">Run search</button>
  </div>
</div>

<div id="err"></div>
<div id="board"><div class="skel">Fetching your board…</div></div>
<div class="foot" id="foot"></div>

<script>
const STATUSES = ["Ready", "Applied", "Interviewing", "Offer", "Rejected"];
const ACTION_LABEL = { mark_applied: "Apply", mark_interviewing: "Interviewing",
  mark_offer: "Offer", reject: "Reject" };

async function load() {
  document.getElementById("err").innerHTML = "";
  document.getElementById("board").innerHTML = '<div class="skel">Fetching your board…</div>';
  let data;
  try {
    const r = await fetch("/api/records");
    data = await r.json();
  } catch (e) {
    return showErr("Network error: " + e.message);
  }
  if (!data.ok) return showErr(data.error || "Failed to load");
  render(data.records);
}

function showErr(msg) {
  document.getElementById("err").innerHTML = '<div class="err">⚠ ' + msg + '</div>';
}

function byStatus(records) {
  const g = {}; STATUSES.forEach((s) => (g[s] = []));
  records.forEach((r) => { (g[r.status] || (g[r.status] = [])).push(r); });
  return g;
}

function emailFrom(notes) {
  const m = notes.match(/APPLY_EMAIL:\s*([^\s\n]+)/i);
  return m ? m[1] : null;
}

function render(records) {
  const g = byStatus(records);
  const ready = g.Ready.length, applied = g.Applied.length,
        iv = g.Interviewing.length, offer = g.Offer.length, rej = g.Rejected.length;
  const now = new Date().toLocaleString("en-CA", { dateStyle: "medium", timeStyle: "short" });
  document.getElementById("sub").textContent =
    `${now} · Raphael Merchant · ${ready} to apply, ${applied} applied, ${iv} interviewing, ${offer} offer, ${rej} rejected`;
  let html = "";
  const emailRows = records.filter((r) => r.status === "Ready" && emailFrom(r.notes));
  if (emailRows.length) {
    html += `<div class="sec">Apply by Email <span class="count">(${emailRows.length})</span></div><div class="cards">`;
    emailRows.forEach((r) => { html += card(r, true); });
    html += "</div>";
  }
  STATUSES.forEach((s) => {
    if (!g[s].length) return;
    html += `<div class="sec">${s} <span class="count">(${g[s].length})</span></div><div class="cards">`;
    g[s].forEach((r) => { html += card(r, false); });
    html += "</div>";
  });
  document.getElementById("board").innerHTML = html;
  document.getElementById("foot").textContent =
    "Live board · data from Airtable · resume/outreach files generated by the pipeline are attached in Airtable.";
}

function card(r, isEmail) {
  const cls = r.status.toLowerCase();
  const meta = [r.location, r.salary, r.source].filter(Boolean).join(" · ");
  const fit = r.fit ? `<span class="fit">${r.fit}</span>` : "";
  const link = r.link
    ? `<a class="a link" href="${r.link}" target="_blank" rel="noopener">Open posting</a>` : "";
  const email = isEmail ? `<span class="email-tag">→ ${esc(emailFrom(r.notes) || "")}</span>` : "";
  let acts = "";
  // View resume (reads Airtable Attachments, opens inline)
  acts += `<button class="a" onclick="viewResume('${r.id}')">Resume</button>`;
  if (r.status === "Ready") {
    acts += `<button class="a app" onclick="act('mark_applied','${r.id}')">${ACTION_LABEL.mark_applied}</button>`;
  }
  if (r.status !== "Interviewing" && r.status !== "Offer") {
    acts += `<button class="a" onclick="act('mark_interviewing','${r.id}')">Interviewing</button>`;
  }
  // Email-apply row: show + send (send requires explicit click = consent)
  if (isEmail) {
    acts += `<button class="a link" onclick="viewEmail('${r.id}')">Draft</button>`;
    acts += `<button class="a app" onclick="sendEmail('${r.id}')">Send (reviewed)</button>`;
  }
  if (r.status === "Ready" || r.status === "Applied") {
    acts += `<button class="a" onclick="act('reject','${r.id}')">Reject</button>`;
  }
  return `<div class="card ${cls}">
    <div class="row1"><span class="co">${esc(r.company)}</span><span class="badge ${cls}">${r.status}</span></div>
    <div class="jt">${esc(r.title)} ${fit}</div>
    <div class="meta mono">${esc(meta)} ${email}</div>
    <div class="actions">${link}${acts}</div>
  </div>`;
}

async function act(verb, id) {
  try {
    const r = await fetch("/api/action", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: verb, record_id: id }),
    });
    const d = await r.json();
    if (!d.ok) return showErr(d.error || "Action failed");
    load();
  } catch (e) { showErr("Network error: " + e.message); }
}

async function runPipeline() {
  showErr(""); // clear
  document.getElementById("sub").textContent = "Kicking off a fresh search… (runs in background)";
  try {
    await fetch("/api/action", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "refresh" }),
    });
  } catch (e) {}
}

async function viewResume(id) {
  const r = await fetch('/api/resume?record_id=' + id);
  const d = await r.json();
  if (d.ok && d.url) window.open(d.url, '_blank');
  else alert('No resume attached yet for this row.');
}

function esc(s) {
  return (s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function viewEmail(id) {
  try {
    const r = await fetch('/api/records');
    const d = await r.json();
    const rec = (d.records || []).find((x) => x.id === id);
    const email = rec ? emailFrom(rec.notes) : null;
    if (!email) return alert('No APPLY_EMAIL set for this row.');
    alert('Recipient: ' + email + '\n\nThe draft plus attached resume is sent when you click Send (reviewed).');
  } catch (e) { alert('Could not load draft: ' + e.message); }
}

async function sendEmail(id) {
  if (!confirm('Send the tailored application email with resume attached? Marks the row Applied.')) return;
  try {
    const r = await fetch('/api/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ record_id: id, approve: true }),
    });
    const d = await r.json();
    if (d.ok) { alert('Sent to ' + d.sent_to + (d.attached ? ' (resume attached)' : '')); load(); }
    else alert('Send failed: ' + (d.error || 'unknown'));
  } catch (e) { alert('Network error: ' + e.message); }
}

load();
</script>
</body>
</html>
